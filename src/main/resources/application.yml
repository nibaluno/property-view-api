spring:
  web:
    locale: en
    locale-resolver: fixed

  application:
    name: property-view-api

  datasource:
    url: jdbc:h2:mem:propertyview;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: base

server:
  port: 8092
  servlet:
    context-path: /property-view

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
