databaseChangeLog:
  - changeSet:
      id: 001-create-hotel
      author: property-view
      changes:
        - createTable:
            tableName: hotel
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_hotel, nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: description, type: VARCHAR(4000) }
              - column: { name: brand, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: house_number, type: INT, constraints: { nullable: false } }
              - column: { name: street, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: city, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: country, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: post_code, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: phone, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: email, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: check_in, type: TIME, constraints: { nullable: false } }
              - column: { name: check_out, type: TIME }

  - changeSet:
      id: 001-create-amenity
      author: property-view
      changes:
        - createTable:
            tableName: amenity
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_amenity, nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: normalized_name, type: VARCHAR(255), constraints: { nullable: false } }

  - changeSet:
      id: 001-create-hotel-amenity
      author: property-view
      changes:
        - createTable:
            tableName: hotel_amenity
            columns:
              - column: { name: hotel_id, type: BIGINT, constraints: { primaryKey: true, primaryKeyName: pk_hotel_amenity, nullable: false } }
              - column: { name: amenity_id, type: BIGINT, constraints: { primaryKey: true, primaryKeyName: pk_hotel_amenity, nullable: false } }
              - column: { name: sort_order, type: INT, constraints: { nullable: false } }
